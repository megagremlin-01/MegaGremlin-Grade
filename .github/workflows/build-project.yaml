name: Build-Plugin
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Manually download ONLY the headers you need
      - name: Download Headers
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path deps
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/obsproject/obs-studio/master/libobs/obs-module.h" -OutFile "deps/obs-module.h"

      # 2. Build your project directly
      - name: Configure & Build
        run: |
          mkdir build
          cd build
          cmake .. -DOBS_INCLUDE_DIR=../deps
          cmake --build . --config Release